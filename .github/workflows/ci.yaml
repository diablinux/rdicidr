name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature-*'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json
      - run: npm ci
        working-directory: codebase/rdicidr-0.1.0
      - run: npm run lint
        working-directory: codebase/rdicidr-0.1.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json
      - run: npm ci
        working-directory: codebase/rdicidr-0.1.0
      - run: npm test -- --watchAll=false
        working-directory: codebase/rdicidr-0.1.0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json
      - run: npm ci
        working-directory: codebase/rdicidr-0.1.0
      - run: npm run build
        working-directory: codebase/rdicidr-0.1.0
