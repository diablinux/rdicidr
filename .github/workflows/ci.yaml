name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/diablinux/rdicidr

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json
      - run: npm ci
        working-directory: codebase/rdicidr-0.1.0
      - run: npm run lint
        working-directory: codebase/rdicidr-0.1.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json
      - run: npm ci
        working-directory: codebase/rdicidr-0.1.0
      - run: CI=true npm test -- --watchAll=false
        working-directory: codebase/rdicidr-0.1.0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json
      - run: npm ci
        working-directory: codebase/rdicidr-0.1.0
      - run: npm run build
        working-directory: codebase/rdicidr-0.1.0

  docker_build_and_push:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: codebase/rdicidr-0.1.0
          file: codebase/rdicidr-0.1.0/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:v1.0.0
